<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Apply a saved theme choice before the first paint, so a visitor who
      picked one never sees a flash of the other. No saved choice means the
      page follows the system setting. This sits above the stylesheets on
      purpose: an inline script placed after one waits for it to download.
    -->
    <script>
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    </script>
